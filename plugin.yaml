id: group
name: QQ 群聊
version: 0.7.0
description: 独立的 QQ 群聊接入，按群配置“仅被@时回复”或“自己主动参与聊天”，每个群可以单独指定人格；群内可发文字、图文和自动语音，可在设置页维护群友标签、读取群友列表、引用群友消息、@ 本群任意真实成员；提到该群人格的名字/简称时会主动接话。适配官方 QQ 0.24.0 的群授权回调、稳定 actionId、平台回执和临时工具结果；0.6.9 修复语音替换降级后再次补发语音，以及分段合并丢失原文换行/空格。0.6.10 让短回复也按空行逐条发送，单条上限为 1 时仍严格保留原文，并把简称前后缀、@ 人数、图片数量、标签长度和成员列表上限改为可配置项。0.6.11 修复群友标签在自动回复时被宿主 senderProfile 丢弃的问题，改由 remark 携带。0.6.12 新增“允许人格 @ 群友”，正文 @昵称 / @QQ号 会解析成本群真实成员并去掉重复 @ 文本。0.7.0 新增自动回复边界（成员忽略/仅回复、屏蔽关键词、每人冷却、每群分/时上限、免打扰）、每群设定与群级覆盖、群 @ 别名、回复时是否 @ 提问者/引用、媒体标签摘要和运行面板；所有规则均由设置页或群级文本配置，不含固定本地内容。
apiVersion: "1.0.0"
depends: [qq, channels, sessions, tools, personas, web]
optionalDepends: [gallery, voice]
sub: []

