description: 独立的 QQ 群聊接入，按群配置“仅被@时回复”或“自己主动参与聊天”，每个群可以单独指定人格；群内可发文字、图文和自动语音，可在设置页维护群友标签、读取群友列表、引用群友消息、@ 本群任意真实成员；提到该群人格的名字/简称时会主动接话。适配官方 QQ 0.24.0 的群授权回调、稳定 actionId 与回执校验。
